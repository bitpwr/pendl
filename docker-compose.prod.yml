# Production Docker Compose for Pendl
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# GTFS import (run once, then periodically):
#   docker compose -f docker-compose.prod.yml run --rm gtfs-import
#
# Environment:
#   Copy .env.example to .env and fill in the values before starting.

x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-}
  DB_USER: ${DB_USER:-}
  DB_PASSWORD: ${DB_PASSWORD:-}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  GTFS_STATIC_URL: ${GTFS_STATIC_URL:-}
  GTFS_REALTIME_TRIP_UPDATES_URL: ${GTFS_REALTIME_TRIP_UPDATES_URL:-}
  GTFS_REALTIME_VEHICLE_POSITIONS_URL: ${GTFS_REALTIME_VEHICLE_POSITIONS_URL:-}
  GTFS_REALTIME_ALERTS_URL: ${GTFS_REALTIME_ALERTS_URL:-}
  GTFS_DATA_DIR: /app/data/gtfs
  GTFS_STATIC_KEY: ${GTFS_STATIC_KEY:-}
  GTFS_REALTIME_KEY: ${GTFS_REALTIME_KEY:-}
  GTFS_VEHICLE_UPDATE_INTERVAL: ${GTFS_VEHICLE_UPDATE_INTERVAL:-}
  GTFS_TRIP_UPDATE_INTERVAL: ${GTFS_TRIP_UPDATE_INTERVAL:-}
  GTFS_SERVICE_ALERT_UPDATE_INTERVAL: ${GTFS_SERVICE_ALERT_UPDATE_INTERVAL:-}

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pendl-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: ${DB_NAME:-}
    volumes:
      - pendl_db:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - pendl_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-} -d ${DB_NAME:-}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pendl-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - pendl_redis:/data
    restart: unless-stopped
    networks:
      - pendl_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  pendl:
    image: bitpwr/pendl:latest
    container_name: pendl-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      <<: *app-env
      # PORT: ${APP_PORT:-3000}
    volumes:
      - ./gtfsdata:/app/data/gtfs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pendl_net

  # One-off service for GTFS import. Run with:
  #   docker compose -f docker-compose.prod.yml run --rm gtfs-import
  gtfs-import:
    image: bitpwr/pendl:latest
    container_name: pendl-gtfs-import
    command: ["tsx", "scripts/import-gtfs-streaming.ts"]
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - ./gtfsdata:/app/data/gtfs
      - pendl_script_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - import
    networks:
      - pendl_net

volumes:
  pendl_db:
    name: pendl_db
  pendl_redis:
    name: pendl_redis
  pendl_script_modules:
    name: pendl_modules

networks:
  pendl_net:
